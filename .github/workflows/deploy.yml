# 自动构建并发布到 GitHub Pages。
# 触发：推送到 main 分支。
# 全流程在 GitHub 服务器完成：装依赖 → 拉无头浏览器 → 抽数据 → 子集化字体 → 预渲染 → 部署。
# 你本地无需安装任何东西。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ↓↓↓ 部署形态在这里改 ↓↓↓
      # 项目页 name.github.io/huaxiaji ：BASE_PATH=/huaxiaji
      # 用户主页 name.github.io 或自定义域名：BASE_PATH=（留空）
      BASE_PATH: /huaxiaji
      SITE_URL: https://example.github.io/huaxiaji
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (extract + subset + prerender)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
